<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPAS Lessines - Service Technique</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        /* Imagem de Fundo Global vinda do GitHub */
        body {
            background-image: url('https://raw.githubusercontent.com/cpaslessines/ServiceTecnique/7220d97d83214482737d80c61f415bd5b24f68ed/Paisagem%20Art%C3%ADstica%20de%20Lessines.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .app-overlay {
            background: rgba(243, 244, 246, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            min-height: 100vh;
        }

        #loginOverlay {
            background-image: url('https://raw.githubusercontent.com/cpaslessines/ServiceTecnique/7220d97d83214482737d80c61f415bd5b24f68ed/Paisagem%20Art%C3%ADstica%20de%20Lessines.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .task-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="app-overlay flex flex-col">

        <!-- OVERLAY DE LOGIN -->
        <div id="loginOverlay" class="fixed inset-0 z-50 flex items-center justify-center p-4">
            <div class="glass-card w-full max-w-md p-8 rounded-2xl shadow-2xl text-center flex flex-col items-center">
                
                <!-- LOGO SVG CPAS LESSINES -->
                <div class="w-24 h-24 mb-4">
                    <svg viewBox="0 0 500 500" class="w-full h-full drop-shadow-md">
                        <rect width="300" height="500" x="0" y="0" fill="#700028" />
                        <rect width="200" height="500" x="300" y="0" fill="#fcdcd4" />
                        <path d="M 250,50 A 180,180 0 1,0 250,410 A 130,130 0 1,0 250,150 A 80,80 0 1,0 250,310 A 30,30 0 1,0 250,230" 
                              fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
                        <path d="M 250,410 C 330,410 420,380 480,270" 
                              fill="none" stroke="#700028" stroke-width="32" stroke-linecap="round"/>
                        <path d="M 420,290 L 490,260 L 470,340 Z" fill="#700028" />
                    </svg>
                </div>

                <h1 class="text-2xl font-bold text-gray-900 mb-1">CPAS LESSINES</h1>
                <p class="text-sm font-semibold text-red-900 uppercase tracking-wider mb-6">Service Technique</p>

                <div id="loginError" class="hidden w-full bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm font-medium">
                    ⚠️ Nom d'utilisateur ou mot de passe incorrect.
                </div>

                <form id="loginForm" class="w-full space-y-4" onsubmit="handleLogin(event)">
                    <div>
                        <label class="block text-left text-xs font-bold text-gray-700 uppercase mb-1">Utilisateur</label>
                        <input type="text" id="loginUser" required placeholder="Ex: st" 
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-800 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-left text-xs font-bold text-gray-700 uppercase mb-1">Mot de passe</label>
                        <input type="password" id="loginPassword" required placeholder="••••••••" 
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-800 focus:outline-none transition">
                    </div>
                    <button type="submit" 
                            class="w-full bg-[#700028] hover:bg-red-900 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-200">
                        Se connecter
                    </button>
                </form>
            </div>
        </div>

        <!-- CABEÇALHO -->
        <header class="bg-[#700028]/95 backdrop-blur-md text-white shadow-lg sticky top-0 z-40">
            <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-white rounded-md p-1 shadow-sm">
                        <svg viewBox="0 0 500 500" class="w-full h-full">
                            <rect width="300" height="500" x="0" y="0" fill="#700028" />
                            <rect width="200" height="500" x="300" y="0" fill="#fcdcd4" />
                            <path d="M 250,50 A 180,180 0 1,0 250,410 A 130,130 0 1,0 250,150 A 80,80 0 1,0 250,310 A 30,30 0 1,0 250,230" 
                                  fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
                            <path d="M 250,410 C 330,410 420,380 480,270" 
                                  fill="none" stroke="#700028" stroke-width="32" stroke-linecap="round"/>
                            <path d="M 420,290 L 490,260 L 470,340 Z" fill="#700028" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-none">CPAS LESSINES</h1>
                        <span class="text-xs text-red-200 uppercase tracking-wider">Service Technique</span>
                    </div>
                </div>
                
                <div class="flex items-center space-x-3">
                    <span id="syncStatus" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                        ● En ligne
                    </span>
                    <button onclick="handleLogout()" title="Déconnexion" class="p-2 hover:bg-red-900 rounded-lg transition text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- PAINEL DE TAREFAS -->
        <main class="flex-1 max-w-5xl w-full mx-auto p-4 space-y-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="text" id="searchInput" oninput="filterTasks()" placeholder="Rechercher une tâche..." 
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200/80 bg-white/90 backdrop-blur-sm shadow-sm focus:ring-2 focus:ring-red-800 focus:outline-none">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <button onclick="openModal()" class="bg-[#700028] hover:bg-red-900 text-white font-bold py-3 px-6 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Nouvelle Tâche</span>
                </button>
            </div>

            <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </main>

        <!-- MODAL -->
        <div id="taskModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden">
                <div class="bg-[#700028] text-white px-6 py-4 flex justify-between items-center">
                    <h3 id="modalTitle" class="font-bold text-lg">Nouvelle Tâche</h3>
                    <button onclick="closeModal()" class="text-white/80 hover:text-white text-2xl font-bold">&times;</button>
                </div>
                <form id="taskForm" onsubmit="saveTask(event)" class="p-6 space-y-4">
                    <input type="hidden" id="taskId">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Titre / Description</label>
                        <input type="text" id="taskTitle" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-800 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Statut</label>
                        <select id="taskStatus" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-800 focus:outline-none">
                            <option value="A faire">À faire</option>
                            <option value="En cours">En cours</option>
                            <option value="Terminé">Terminé</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Priorité</label>
                        <select id="taskPriority" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-800 focus:outline-none">
                            <option value="Basse">Basse</option>
                            <option value="Moyenne" selected>Moyenne</option>
                            <option value="Haute">Haute</option>
                            <option value="Urgente">Urgente</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Remarques / Notes</label>
                        <textarea id="taskNotes" rows="3" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-red-800 focus:outline-none"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-2">
                        <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium">Annuler</button>
                        <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#700028] text-white font-bold hover:bg-red-900 shadow-md">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- SCRIPT FIREBASE & LÓGICA -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKey_cpasLessines2026",
            authDomain: "cpas-lessines-st.firebaseapp.com",
            projectId: "cpas-lessines-st",
            storageBucket: "cpas-lessines-st.appspot.com",
            messagingSenderId: "000000000000",
            appId: "1:000000000000:web:000000000000"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allTasks = [];

        window.addEventListener('DOMContentLoaded', () => {
            const isAuth = localStorage.getItem('cpas_st_auth');
            if (isAuth === 'true') {
                document.getElementById('loginOverlay').classList.add('hidden');
                listenTasks();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            if (user === 'st' && pass === 'Lessines2026!') {
                localStorage.setItem('cpas_st_auth', 'true');
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('loginError').classList.add('hidden');
                listenTasks();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('cpas_st_auth');
            location.reload();
        }

        function listenTasks() {
            db.collection('tasks').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                allTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTasks(allTasks);
            }, err => {
                console.error("Erreur Firestore:", err);
                document.getElementById('syncStatus').innerText = "● Hors ligne";
                document.getElementById('syncStatus').className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800";
            });
        }

        function renderTasks(tasks) {
            const list = document.getElementById('taskList');
            list.innerHTML = '';

            if (tasks.length === 0) {
                list.innerHTML = `<div class="col-span-full text-center py-10 text-gray-600 font-medium bg-white/70 backdrop-blur-md rounded-2xl shadow-sm">Aucune tâche trouvée.</div>`;
                return;
            }

            tasks.forEach(task => {
                const priorityColors = {
                    'Basse': 'bg-gray-100 text-gray-700',
                    'Moyenne': 'bg-blue-100 text-blue-800',
                    'Haute': 'bg-orange-100 text-orange-800',
                    'Urgente': 'bg-red-100 text-red-800 font-bold'
                };

                const card = document.createElement('div');
                card.className = "task-card p-5 rounded-2xl shadow-sm flex flex-col justify-between hover:shadow-md transition";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${priorityColors[task.priority] || 'bg-gray-100'}">
                                ${task.priority || 'Moyenne'}
                            </span>
                            <span class="text-xs font-bold uppercase tracking-wider ${task.status === 'Terminé' ? 'text-green-600' : 'text-amber-600'}">
                                ${task.status || 'A faire'}
                            </span>
                        </div>
                        <h4 class="font-bold text-gray-900 text-base mb-1">${task.title}</h4>
                        ${task.notes ? `<p class="text-sm text-gray-600 mb-4 whitespace-pre-line">${task.notes}</p>` : ''}
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-gray-100 text-xs text-gray-400">
                        <button onclick="editTask('${task.id}')" class="text-blue-600 hover:text-blue-800 font-bold">Modifier</button>
                        <button onclick="deleteTask('${task.id}')" class="text-red-500 hover:text-red-700 font-bold">Supprimer</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function filterTasks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allTasks.filter(t => 
                (t.title && t.title.toLowerCase().includes(query)) ||
                (t.notes && t.notes.toLowerCase().includes(query))
            );
            renderTasks(filtered);
        }

        function openModal() {
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            document.getElementById('modalTitle').innerText = 'Nouvelle Tâche';
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
        }

        function editTask(id) {
            const task = allTasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('taskId').value = task.id;
            document.getElementById('taskTitle').value = task.title || '';
            document.getElementById('taskStatus').value = task.status || 'A faire';
            document.getElementById('taskPriority').value = task.priority || 'Moyenne';
            document.getElementById('taskNotes').value = task.notes || '';

            document.getElementById('modalTitle').innerText = 'Modifier la Tâche';
            document.getElementById('taskModal').classList.remove('hidden');
        }

        function saveTask(e) {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const data = {
                title: document.getElementById('taskTitle').value,
                status: document.getElementById('taskStatus').value,
                priority: document.getElementById('taskPriority').value,
                notes: document.getElementById('taskNotes').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (id) {
                db.collection('tasks').doc(id).update(data);
            } else {
                data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                db.collection('tasks').add(data);
            }
            closeModal();
        }

        function deleteTask(id) {
            if (confirm("Voulez-vous vraiment supprimer cette tâche ?")) {
                db.collection('tasks').doc(id).delete();
            }
        }
    </script>
</body>
</html>
