<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPAS LESSINES - Service Technique</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    /* Ecrã de Login com a Imagem Artística de Lessines e Overlay Escuro para Contraste */
    #auth-overlay {
      background-image: linear-gradient(rgba(2, 6, 23, 0.75), rgba(2, 6, 23, 0.85)), url('https://github.com/cpaslessines/ServiceTecnique/raw/8b6706cc9f7ee3cbd0e7fda68b2b30940b5ab4d8/Paisagem%20Art%C3%ADstica%20de%20Lessines.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 overflow-x-hidden">

  <!-- SHARED USER LOGIN OVERLAY (FULLSCREEN) -->
  <div id="auth-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
      
      <!-- Brand Logo Header -->
      <div class="text-center space-y-2">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-[#700028]/20 border border-[#700028]/40 flex items-center justify-center text-red-300 font-bold shadow-lg">
          <i data-lucide="wrench" class="w-7 h-7"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-white">CPAS LESSINES</h1>
        <p class="text-xs text-slate-300 font-medium">Connexion Unique - Service Technique</p>
      </div>

      <!-- Auth Error Alert -->
      <div id="auth-error-alert" class="hidden p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-xs flex items-center space-x-2">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
        <span id="auth-error-text">Nom d'utilisateur ou mot de passe incorrect.</span>
      </div>

      <!-- Shared Credentials Form -->
      <form id="auth-form" onsubmit="handleSharedLoginSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-[10px] uppercase font-bold text-slate-300 mb-1">Nom d'Utilisateur</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
            <input type="text" id="auth-username" required placeholder="st" autocomplete="username"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-[10px] uppercase font-bold text-slate-300 mb-1">Mot de Passe</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
            <input type="password" id="auth-password" required placeholder="••••••••" autocomplete="current-password"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center space-x-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>Se Connecter</span>
        </button>
      </form>

      <p class="text-[10px] text-center text-slate-400">Accès restreint au personnel autorisé (ST).</p>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 font-bold shadow-sm">
        <i data-lucide="wrench" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 id="app-company-name" class="font-bold text-sm tracking-tight text-slate-100">CPAS LESSINES</h1>
          <span id="sync-badge" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 mr-1 animate-pulse"></span>Connexion...
          </span>
        </div>
        <p id="user-display-email" class="text-[11px] text-slate-400 font-medium">Technicien ST</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button onclick="openAddIssueModal()" class="flex items-center space-x-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-lg shadow-amber-500/20 transition-all active:scale-95">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Nouvelle Tâche</span>
      </button>

      <button onclick="handleSharedLogout()" title="Déconnexion" class="p-2 bg-slate-900 border border-slate-800 hover:bg-red-500/10 hover:border-red-500/30 hover:text-red-400 text-slate-400 rounded-xl text-xs transition-all">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- DIAGNOSTIC BANNER -->
  <div id="diagnostic-banner" class="bg-amber-500/10 border-b border-amber-500/20 px-4 py-2.5 text-xs flex items-center justify-between text-amber-300">
    <div class="flex items-center space-x-2">
      <i data-lucide="info" class="w-4 h-4 text-amber-400 shrink-0"></i>
      <span id="diagnostic-text" class="font-medium">Vérification de la session et synchronisation...</span>
    </div>
    <button onclick="document.getElementById('diagnostic-banner').classList.add('hidden')" class="text-amber-400 hover:text-white">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- MAIN APP CONTAINER -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6 pb-24">

    <!-- SEARCH SECTION -->
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
        <i data-lucide="search" class="w-4 h-4"></i>
      </div>
      <input type="text" id="search-input" placeholder="Rechercher une panne, un outil, un équipement..." 
        class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-800 rounded-2xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-colors shadow-sm">
    </div>

    <!-- CATEGORIES FILTER -->
    <div class="flex items-center space-x-2 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filterCategory('todos')" class="cat-btn bg-amber-500 text-slate-950 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap shadow-md transition-all">Tous</button>
      <button onclick="filterCategory('plomberie')" class="cat-btn bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">Plomberie</button>
      <button onclick="filterCategory('electrique')" class="cat-btn bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">Électrique</button>
      <button onclick="filterCategory('mobilier')" class="cat-btn bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">Mobilier</button>
      <button onclick="filterCategory('peinture')" class="cat-btn bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">Peinture & Murs</button>
      <button onclick="filterCategory('tv')" class="cat-btn bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">TV & Multimédia</button>
      <button onclick="filterCategory('serrurerie')" class="cat-btn bg-slate-900 hover:bg-slate-800 text-slate-400 border border-slate-800 px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all">Serrurerie</button>
    </div>

    <!-- ISSUES GRID -->
    <div id="issues-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
      <!-- Populated dynamically -->
    </div>

  </main>

  <!-- ADD NEW ISSUE MODAL -->
  <div id="add-issue-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="font-bold text-xs text-slate-100 flex items-center">
          <i data-lucide="plus-circle" class="w-4 h-4 mr-2 text-amber-400"></i> Ajouter une Nouvelle Tâche / Panne
        </h3>
        <button onclick="closeAddIssueModal()" class="p-1.5 rounded-xl bg-slate-950 border border-slate-800 text-slate-400 hover:text-slate-100">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="add-issue-form" onsubmit="handleNewIssueSubmit(event)" class="p-4 sm:p-6 overflow-y-auto space-y-4 flex-1">
        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Titre de la Panne / Tâche</label>
          <input type="text" id="custom-title" required placeholder="Ex: Remplacement ampoule corridor" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Catégorie</label>
            <select id="custom-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
              <option value="plomberie">Plomberie</option>
              <option value="electrique">Électrique</option>
              <option value="mobilier">Mobilier</option>
              <option value="peinture">Peinture & Murs</option>
              <option value="tv">TV & Multimédia</option>
              <option value="serrurerie">Serrurerie</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Difficulté</label>
            <select id="custom-difficulty" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
              <option value="Facile">Facile</option>
              <option value="Moyenne">Moyenne</option>
              <option value="Difficile">Difficile</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Matériel Requis (séparé par des virgules)</label>
          <input type="text" id="custom-materials" required placeholder="Ex: Tournevis, Ampoule LED E27, Escabeau" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">Étapes de l'Intervention (une par ligne)</label>
          <textarea id="custom-steps" rows="4" required placeholder="Étape 1&#10;Étape 2" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeAddIssueModal()" class="px-4 py-2 bg-slate-950 hover:bg-slate-800 text-slate-400 rounded-xl text-xs font-medium">Annuler</button>
          <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl text-xs font-bold shadow-lg shadow-amber-500/20">Créer la Tâche</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FIREBASE & REALTIME SYNC MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACXjspbF8vSSFY4mIqhKy0LdaCRNSjsq4",
      authDomain: "cpas-lessines-st.firebaseapp.com",
      projectId: "cpas-lessines-st",
      storageBucket: "cpas-lessines-st.firebasestorage.app",
      messagingSenderId: "57517677345",
      appId: "1:57517677345:web:5dc915d7390bd7d5dabc60",
      measurementId: "G-C4V40YYT8J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tasksCollection = collection(db, 'tasks');

    let unsubscribeSync = null;
    let allIssues = [];
    let currentCategory = 'todos';

    const HARDCODED_USER = "st";
    const HARDCODED_PASS = "Lessines2026!";

    const defaultIssues = [
      {
        id: 'plomb-1',
        category: 'plomberie',
        title: 'Fuite de Robinet / Lave-mains',
        time: '15-30 min',
        difficulty: 'Facile',
        safety: 'Coupez l\'eau au robinet d\'arrêt sous le lavabo avant d\'intervenir.',
        materials: ['Chiffon microfibre', 'Clé anglaise / Clé à molette', 'Joints toriques de rechange', 'Ruban Téflon'],
        steps: [
          'Fermez les robinets d\'arrivée d\'eau chaude et froide.',
          'Démontez le mousseur/brise-jet pour vérifier s\'il est entartré.',
          'Remplacez le joint défectueux ou appliquez du ruban Téflon sur le filetage.'
        ]
      }
    ];

    window.handleSharedLoginSubmit = async function(e) {
      e.preventDefault();
      const userVal = document.getElementById('auth-username').value.trim();
      const passVal = document.getElementById('auth-password').value.trim();
      const alertBox = document.getElementById('auth-error-alert');

      alertBox.classList.add('hidden');
      let valid = false;

      if (userVal === HARDCODED_USER && passVal === HARDCODED_PASS) {
        valid = true;
      }

      if (valid) {
        localStorage.setItem('cpas_st_auth', 'true');
        document.getElementById('auth-overlay').classList.add('hidden');
        startFirestoreSync();
      } else {
        alertBox.classList.remove('hidden');
      }
    };

    window.handleSharedLogout = function() {
      if (confirm("Voulez-vous vraiment vous déconnecter ?")) {
        localStorage.removeItem('cpas_st_auth');
        if (unsubscribeSync) unsubscribeSync();
        document.getElementById('auth-overlay').classList.remove('hidden');
        window.updateSyncBadge('error', 'Déconnecté');
      }
    };

    function checkExistingSession() {
      const isAuth = localStorage.getItem('cpas_st_auth');
      if (isAuth === 'true') {
        document.getElementById('auth-overlay').classList.add('hidden');
        startFirestoreSync();
      } else {
        document.getElementById('auth-overlay').classList.remove('hidden');
        window.updateSyncBadge('error', 'Veuillez vous connecter');
      }
    }

    window.updateSyncBadge = function(status, text) {
      const badge = document.getElementById('sync-badge');
      const diagBanner = document.getElementById('diagnostic-banner');
      const diagText = document.getElementById('diagnostic-text');
      
      if (!badge) return;

      if (status === 'online') {
        badge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 animate-pulse"></span>${text}`;
        diagText.textContent = "✅ Session 'st' active & Base de données en direct !";
        diagBanner.className = "bg-emerald-500/10 border-b border-emerald-500/20 px-4 py-2.5 text-xs flex items-center justify-between text-emerald-300";
      } else if (status === 'error') {
        badge.className = "inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-red-500/10 text-red-400 border border-red-500/20";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-400 mr-1"></span>${text}`;
        diagText.textContent = `🔒 ${text}`;
        diagBanner.className = "bg-red-500/10 border-b border-red-500/20 px-4 py-2.5 text-xs flex items-center justify-between text-red-300";
      }
    };

    function startFirestoreSync() {
      window.updateSyncBadge('pending', 'Synchronisation...');

      unsubscribeSync = onSnapshot(tasksCollection, (snapshot) => {
        window.updateSyncBadge('online', 'En Direct');
        
        const cloudIssues = [];
        snapshot.forEach((docSnap) => {
          cloudIssues.push(docSnap.data());
        });

        if (cloudIssues.length === 0 && !snapshot.metadata.fromCache) {
          defaultIssues.forEach(async (issue) => {
            const docRef = doc(db, 'tasks', issue.id);
            await setDoc(docRef, { ...issue, updatedAt: Date.now(), updatedBy: 'st' });
          });
          allIssues = [...defaultIssues];
        } else if (cloudIssues.length > 0) {
          allIssues = cloudIssues;
        }

        window.renderIssues();
      }, (error) => {
        console.error("Firestore sync error:", error);
        window.updateSyncBadge('error', 'Erreur d\'accès Firestore');
      });
    }

    window.renderIssues = function(filterText = '') {
      const container = document.getElementById('issues-list');
      if (!container) return;
      container.innerHTML = '';

      const filtered = allIssues.filter(issue => {
        const matchCategory = currentCategory === 'todos' || issue.category === currentCategory;
        const activeMat = issue.materials || [];
        const matchText = !filterText || 
          (issue.title && issue.title.toLowerCase().includes(filterText)) ||
          activeMat.some(m => m.toLowerCase().includes(filterText));
        return matchCategory && matchText;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-xs col-span-full">
            Aucun problème trouvé.
          </div>`;
        return;
      }

      filtered.forEach(issue => {
        const activeMat = issue.materials || [];
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md flex flex-col justify-between";

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2.5">
              <span class="text-[10px] uppercase font-bold tracking-wider px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
                ${issue.category || 'Général'}
              </span>
              <span class="text-[10px] text-slate-400 font-medium">
                ${issue.difficulty || 'Facile'}
              </span>
            </div>
            <h3 class="font-bold text-xs text-slate-100 mb-2.5 leading-snug">${issue.title || 'Sans Titre'}</h3>
            <div class="flex flex-wrap gap-1 mb-2">
              ${activeMat.slice(0, 3).map(m => `
                <span class="text-[10px] bg-slate-950 text-slate-400 px-2 py-0.5 rounded-md border border-slate-800/80">
                  ${m}
                </span>
              `).join('')}
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      if (typeof lucide !== 'undefined') lucide.createIcons();
    };

    window.filterCategory = function(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-slate-950', 'shadow-md');
        btn.classList.add('bg-slate-900', 'text-slate-400', 'border', 'border-slate-800');
      });
      event.currentTarget.classList.remove('bg-slate-900', 'text-slate-400', 'border', 'border-slate-800');
      event.currentTarget.classList.add('bg-amber-500', 'text-slate-950', 'shadow-md');
      window.renderIssues();
    };

    window.openAddIssueModal = function() {
      document.getElementById('add-issue-modal').classList.remove('hidden');
    };

    window.closeAddIssueModal = function() {
      document.getElementById('add-issue-modal').classList.add('hidden');
    };

    window.handleNewIssueSubmit = async function(e) {
      e.preventDefault();
      const newId = 'custom-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7);
      const newIssue = {
        id: newId,
        title: document.getElementById('custom-title').value,
        category: document.getElementById('custom-category').value,
        difficulty: document.getElementById('custom-difficulty').value,
        time: '20 min',
        safety: 'Respectez les consignes de sécurité standards.',
        materials: document.getElementById('custom-materials').value.split(',').map(s => s.trim()).filter(Boolean),
        steps: document.getElementById('custom-steps').value.split('\n').map(s => s.trim()).filter(Boolean),
        updatedAt: Date.now(),
        updatedBy: 'st'
      };

      const docRef = doc(db, 'tasks', newId);
      await setDoc(docRef, newIssue);

      window.closeAddIssueModal();
      document.getElementById('add-issue-form').reset();
    };

    document.addEventListener('DOMContentLoaded', () => {
      checkExistingSession();

      const searchEl = document.getElementById('search-input');
      if (searchEl) {
        searchEl.addEventListener('input', function(e) {
          window.renderIssues(e.target.value.toLowerCase());
        });
      }

      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
